<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1100" height="560" fill="#060A1F"/>
  <text x="40" y="44" fill="#FFFFFF" font-size="24" font-weight="700">Backbench — architecture</text>
  <text x="40" y="70" fill="#8D98BF" font-size="14">The browser only holds the public key. Gemini, YouTube and Resend keys live inside Edge Functions.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B9BFF"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="40" y="140" width="220" height="160" rx="14" fill="#0E1533" stroke="#2F6BFF" stroke-width="2"/>
  <text x="60" y="172" fill="#6B9BFF" font-size="12" font-weight="700" letter-spacing="1.5">BROWSER</text>
  <text x="60" y="198" fill="#fff" font-size="18" font-weight="700">React 19 + Vite</text>
  <text x="60" y="222" fill="#B9C3D8" font-size="13">TypeScript · Tailwind v4</text>
  <text x="60" y="242" fill="#B9C3D8" font-size="13">Lazy-loaded pages</text>
  <text x="60" y="262" fill="#B9C3D8" font-size="13">Vercel · CSP · HSTS</text>

  <!-- Supabase -->
  <rect x="330" y="120" width="250" height="300" rx="14" fill="#0E1533" stroke="#3ECF8E" stroke-width="2"/>
  <text x="350" y="150" fill="#3ECF8E" font-size="12" font-weight="700" letter-spacing="1.5">SUPABASE</text>
  <rect x="350" y="162" width="210" height="54" rx="8" fill="#111D45"/>
  <text x="364" y="185" fill="#fff" font-size="15" font-weight="600">Auth</text>
  <text x="364" y="204" fill="#B9C3D8" font-size="12">Email one-time code</text>
  <rect x="350" y="226" width="210" height="54" rx="8" fill="#111D45"/>
  <text x="364" y="249" fill="#fff" font-size="15" font-weight="600">Postgres + RLS</text>
  <text x="364" y="268" fill="#B9C3D8" font-size="12">Rules on every table</text>
  <rect x="350" y="290" width="210" height="54" rx="8" fill="#111D45"/>
  <text x="364" y="313" fill="#fff" font-size="15" font-weight="600">Private Storage</text>
  <text x="364" y="332" fill="#B9C3D8" font-size="12">10-minute signed links</text>
  <rect x="350" y="354" width="210" height="50" rx="8" fill="#111D45"/>
  <text x="364" y="376" fill="#fff" font-size="14" font-weight="600">Triggers + pg_net</text>
  <text x="364" y="394" fill="#B9C3D8" font-size="12">Fire on new request / order</text>

  <!-- Edge functions -->
  <rect x="650" y="140" width="200" height="110" rx="14" fill="#0E1533" stroke="#6B9BFF" stroke-width="2"/>
  <text x="668" y="170" fill="#6B9BFF" font-size="11" font-weight="700" letter-spacing="1.5">EDGE FUNCTION</text>
  <text x="668" y="196" fill="#fff" font-size="17" font-weight="700">syllabus-videos</text>
  <text x="668" y="218" fill="#B9C3D8" font-size="12">Login check, daily limits,</text>
  <text x="668" y="235" fill="#B9C3D8" font-size="12">30-day shared cache</text>

  <rect x="650" y="324" width="200" height="96" rx="14" fill="#0E1533" stroke="#6B9BFF" stroke-width="2"/>
  <text x="668" y="354" fill="#6B9BFF" font-size="11" font-weight="700" letter-spacing="1.5">EDGE FUNCTION</text>
  <text x="668" y="380" fill="#fff" font-size="17" font-weight="700">notify</text>
  <text x="668" y="402" fill="#B9C3D8" font-size="12">Secret header, daily cap</text>

  <!-- External -->
  <rect x="920" y="130" width="140" height="56" rx="10" fill="#111D45" stroke="#2A3866"/>
  <text x="990" y="154" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Gemini API</text>
  <text x="990" y="173" fill="#8D98BF" font-size="11" text-anchor="middle">reads the syllabus</text>
  <rect x="920" y="204" width="140" height="56" rx="10" fill="#111D45" stroke="#2A3866"/>
  <text x="990" y="228" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">YouTube Data</text>
  <text x="990" y="247" fill="#8D98BF" font-size="11" text-anchor="middle">finds lectures</text>
  <rect x="920" y="344" width="140" height="56" rx="10" fill="#111D45" stroke="#2A3866"/>
  <text x="990" y="368" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Resend</text>
  <text x="990" y="387" fill="#8D98BF" font-size="11" text-anchor="middle">emails</text>

  <!-- Arrows -->
  <path d="M260 220 H325" stroke="#6B9BFF" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="266" y="210" fill="#8D98BF" font-size="11">JWT</text>
  <path d="M150 140 V100 H750 V135" stroke="#6B9BFF" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="420" y="92" fill="#8D98BF" font-size="11">syllabus upload (logged-in user only)</text>
  <path d="M560 379 H645" stroke="#6B9BFF" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M850 175 H915" stroke="#6B9BFF" stroke-width="2" marker-end="url(#a)"/>
  <path d="M850 222 H915" stroke="#6B9BFF" stroke-width="2" marker-end="url(#a)"/>
  <path d="M850 372 H915" stroke="#6B9BFF" stroke-width="2" marker-end="url(#a)"/>
  <path d="M455 420 V470 H990 V405" stroke="#6B9BFF" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="600" y="462" fill="#8D98BF" font-size="11">login codes (SMTP)</text>

  <text x="40" y="530" fill="#5E6A93" font-size="12">Browser → Supabase uses Row Level Security, so the public key can only read and change what the logged-in user is allowed to.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
